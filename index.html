<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#f5f8f6"
>

<title>Il tuo regalo WILDU</title>

<style>

  /* =========================================================
     BASE
     ========================================================= */

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding:
      max(20px, env(safe-area-inset-top))
      max(18px, env(safe-area-inset-right))
      max(20px, env(safe-area-inset-bottom))
      max(18px, env(safe-area-inset-left));

    background:
      radial-gradient(
        circle at top,
        #ffffff 0%,
        #f8faf9 42%,
        #eef4f0 100%
      );

    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      Arial,
      sans-serif;

    color: #243129;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }


  /* =========================================================
     CONTENITORE
     ========================================================= */

  .contenitore {
    width: 100%;
    max-width: 500px;

    text-align: center;
  }

  .card {
    width: 100%;

    padding: 30px 24px 24px;

    background: rgba(255, 255, 255, 0.96);

    border:
      1px solid
      rgba(36, 86, 56, 0.09);

    border-radius: 24px;

    box-shadow:
      0 14px 42px
      rgba(32, 74, 47, 0.09);
  }


  /* =========================================================
     LOGO WILDU
     ========================================================= */

  .logo-wrap {
    display: flex;
    justify-content: center;
    align-items: center;

    margin-bottom: 15px;
  }

  .logo-wildu {
    display: block;

    width: 68px;
    height: 68px;

    object-fit: contain;
  }


  /* =========================================================
     TESTI
     ========================================================= */

  h1 {
    margin: 0;

    font-size: 24px;
    line-height: 1.22;
    font-weight: 700;

    letter-spacing: -0.3px;

    color: #203128;
  }

  .intro {
    max-width: 395px;

    margin: 9px auto 18px;

    color: #67736c;

    font-size: 14.5px;
    line-height: 1.5;
  }


  /* =========================================================
     BOX REGALO
     ========================================================= */

  .regalo-box {
    margin: 0 0 21px;

    padding: 15px 16px;

    background: #f6faf7;

    border:
      1px solid
      rgba(38, 100, 58, 0.07);

    border-radius: 15px;
  }

  .regalo-icon {
    display: block;

    margin-bottom: 5px;

    font-size: 25px;
    line-height: 1;
  }

  .regalo-titolo {
    color: #31513b;

    font-size: 14px;
    line-height: 1.4;
    font-weight: 700;
  }

  .regalo-tipo {
    display: block;

    margin-top: 3px;

    color: #748078;

    font-size: 12px;
  }


  /* =========================================================
     PULSE
     ========================================================= */

  @keyframes respiro {

    0% {
      transform: scale(1);

      box-shadow:
        0 5px 17px
        rgba(37, 211, 102, 0.27);
    }

    50% {
      transform: scale(1.035);

      box-shadow:
        0 10px 24px
        rgba(37, 211, 102, 0.39);
    }

    100% {
      transform: scale(1);

      box-shadow:
        0 5px 17px
        rgba(37, 211, 102, 0.27);
    }

  }


  /* =========================================================
     PULSANTE PRINCIPALE
     ========================================================= */

  .pulsante-regalo {
    width: 100%;

    appearance: none;
    -webkit-appearance: none;

    border: none;

    padding: 16px 20px;

    border-radius: 999px;

    background: #25D366;
    color: #ffffff;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 10px;

    font-size: 16.5px;
    line-height: 1.2;
    font-weight: 700;

    cursor: pointer;

    box-shadow:
      0 5px 17px
      rgba(37, 211, 102, 0.27);

    animation:
      respiro
      2.2s
      infinite
      ease-in-out;

    transition:
      background-color 0.2s ease;

    -webkit-tap-highlight-color: transparent;

    -webkit-user-select: none;
    user-select: none;

    touch-action: manipulation;
  }

  .pulsante-regalo:hover {
    background: #20bd5a;
  }

  .pulsante-regalo:active {
    background: #18a94e;
  }

  .pulsante-regalo:disabled {
    cursor: default;

    opacity: 0.78;

    animation: none;
  }


  /* =========================================================
     ICONA
     ========================================================= */

  .icona-download {
    width: 24px;
    height: 24px;

    fill: currentColor;

    flex-shrink: 0;

    pointer-events: none;
  }


  /* =========================================================
     STATO
     ========================================================= */

  .stato {
    min-height: 19px;

    margin-top: 11px;

    color: #748078;

    font-size: 12px;
    line-height: 1.4;
  }


  /* =========================================================
     NOTA
     ========================================================= */

  .nota {
    margin-top: 14px;

    padding: 12px 14px;

    border-radius: 13px;

    background: #fafcfb;

    color: #69766e;

    font-size: 12.5px;
    line-height: 1.5;
  }

  .nota strong {
    color: #405448;
  }


  /* =========================================================
     TORNA ALLA HOME
     ========================================================= */

  .separatore {
    width: 58px;
    height: 1px;

    margin: 21px auto 14px;

    background: #e3e9e5;
  }

  .pulsante-indietro {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 6px;

    padding: 8px 12px;

    border-radius: 9px;

    color: #657169;

    font-size: 14px;
    line-height: 1.3;
    font-weight: 600;

    text-decoration: none;

    transition:
      color 0.2s ease,
      background-color 0.2s ease;
  }

  .pulsante-indietro:hover {
    color: #315a3e;

    background: #f2f6f3;
  }


  /* =========================================================
     MOBILE
     ========================================================= */

  @media (max-width: 420px) {

    body {
      padding:
        max(14px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(14px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
    }

    .card {
      padding: 26px 18px 20px;

      border-radius: 21px;
    }

    .logo-wildu {
      width: 62px;
      height: 62px;
    }

    h1 {
      font-size: 22px;
    }

    .intro {
      font-size: 14px;
    }

    .pulsante-regalo {
      padding: 15px 17px;

      font-size: 15.5px;
    }

  }

</style>
</head>


<body>

<div class="contenitore">

  <main class="card">


    <!-- =====================================================
         LOGO WILDU REALE
         ===================================================== -->

    <div class="logo-wrap">

      <img
        class="logo-wildu"
        src="https://res.cloudinary.com/daiyrgmbb/image/upload/v1773848193/icona_trasp_bocyr5.png"
        alt="WILDU"
      >

    </div>


    <!-- =====================================================
         TESTI
         ===================================================== -->

    <h1>
      Il tuo regalo è pronto
    </h1>

    <p class="intro">
      Apri il PDF riservato alla community e conservalo
      per le tue prossime escursioni.
    </p>


    <!-- =====================================================
         FILE
         ===================================================== -->

    <div class="regalo-box">

      <span
        class="regalo-icon"
        aria-hidden="true"
      >
        🎁
      </span>

      <div class="regalo-titolo">
        Basi sull'orientamento
      </div>

      <span class="regalo-tipo">
        Guida PDF
      </span>

    </div>


    <!-- =====================================================
         PULSANTE
         ===================================================== -->

    <button
      id="pulsanteRegalo"
      class="pulsante-regalo"
      type="button"
    >

      <svg
        class="icona-download"
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
        xmlns="http://www.w3.org/2000/svg"
      >

        <path
          d="M5 20h14v-2H5v2zm14-9h-4V3H9v8H5l7 7 7-7z"
        />

      </svg>

      <span>
        APRI IL TUO REGALO
      </span>

    </button>


    <div
      id="stato"
      class="stato"
      aria-live="polite"
    ></div>


    <!-- =====================================================
         NOTA
         ===================================================== -->

    <div class="nota">

      Il documento potrebbe aprirsi nell'app Google Drive.

      <br>

      <strong>
        Quando hai finito, torna al browser:
      </strong>

      ritroverai automaticamente la home WILDU.

    </div>


    <!-- =====================================================
         RITORNO MANUALE
         ===================================================== -->

    <div class="separatore"></div>


    <a
      class="pulsante-indietro"
      href="https://sites.google.com/view/trekking-eventi-gratis/home"
    >
      ← Torna alla home WILDU
    </a>


  </main>

</div>


<script>

(function () {

  "use strict";


  /* =========================================================
     URL REALI
     ========================================================= */

  const LINK_REGALO =
    "https://drive.google.com/file/d/1zAEKWp1pgma3Z6IgDXnUpiHlHlHpyL1M/view?usp=drivesdk";


  const PAGINA_RITORNO =
    "https://sites.google.com/view/trekking-eventi-gratis/home";


  /* =========================================================
     CONFIGURAZIONE
     ========================================================= */

  const STORAGE_KEY =
    "wildu_regalo_orientamento_v2";


  const DURATA_MARKER_MS =
    30 * 60 * 1000;


  const pulsante =
    document.getElementById("pulsanteRegalo");


  const stato =
    document.getElementById("stato");


  let aperturaInCorso = false;

  let paginaDiventataNascosta = false;

  let redirectEseguito = false;


  /* =========================================================
     MOBILE / TABLET
     ========================================================= */

  function dispositivoMobileOTablet() {

    const ua =
      navigator.userAgent || "";


    if (
      /Android|iPhone|iPad|iPod/i.test(ua)
    ) {

      return true;

    }


    /*
     * iPadOS moderno può identificarsi come Mac.
     */

    if (
      navigator.platform === "MacIntel" &&
      navigator.maxTouchPoints > 1
    ) {

      return true;

    }


    return false;

  }


  /* =========================================================
     STORAGE
     ========================================================= */

  function salvaMarker() {

    try {

      sessionStorage.setItem(
        STORAGE_KEY,
        String(Date.now())
      );

    } catch (errore) {

      /*
       * Drive deve comunque aprirsi
       * anche se lo storage non è disponibile.
       */

    }

  }


  function leggiMarker() {

    try {

      const valore =
        sessionStorage.getItem(STORAGE_KEY);


      if (!valore) {

        return null;

      }


      const timestamp =
        Number(valore);


      if (!Number.isFinite(timestamp)) {

        sessionStorage.removeItem(STORAGE_KEY);

        return null;

      }


      if (
        Date.now() - timestamp >
        DURATA_MARKER_MS
      ) {

        sessionStorage.removeItem(STORAGE_KEY);

        return null;

      }


      return timestamp;

    } catch (errore) {

      return null;

    }

  }


  function cancellaMarker() {

    try {

      sessionStorage.removeItem(STORAGE_KEY);

    } catch (errore) {

      /* Nessuna azione necessaria. */

    }

  }


  /* =========================================================
     RITORNO ALLA HOME
     ========================================================= */

  function tornaAllaHome() {

    if (redirectEseguito) {

      return;

    }


    redirectEseguito = true;


    cancellaMarker();


    /*
     * IMPORTANTE:
     *
     * destinazione finale del bridge gift:
     *
     * /home
     *
     * NON /benvenuto.
     */

    window.location.replace(
      PAGINA_RITORNO
    );

  }


  /* =========================================================
     MOBILE
     ========================================================= */

  function aperturaMobile() {

    aperturaInCorso = true;

    paginaDiventataNascosta = false;


    salvaMarker();


    stato.textContent =
      "Apertura del tuo regalo…";


    /*
     * Su mobile niente _blank e niente window.open.
     *
     * In questo modo evitiamo la gestione fragile
     * delle schede esterne su iPhone/iPad.
     */

    window.location.assign(
      LINK_REGALO
    );

  }


  /* =========================================================
     DESKTOP
     ========================================================= */

  function aperturaDesktop() {

    /*
     * L'apertura avviene direttamente
     * dal gesto dell'utente.
     */

    const schedaDrive =
      window.open(
        LINK_REGALO,
        "_blank"
      );


    if (schedaDrive) {

      try {

        schedaDrive.opener = null;

      } catch (errore) {

        /* Nessuna azione necessaria. */

      }


      stato.textContent =
        "Regalo aperto. Ritorno alla home WILDU…";


      window.setTimeout(
        tornaAllaHome,
        180
      );


      return;

    }


    /*
     * Popup bloccato:
     * fallback nella stessa scheda.
     */

    aperturaMobile();

  }


  /* =========================================================
     CLICK PRINCIPALE
     ========================================================= */

  pulsante.addEventListener(
    "click",
    function () {

      if (aperturaInCorso) {

        return;

      }


      aperturaInCorso = true;


      pulsante.disabled = true;


      if (dispositivoMobileOTablet()) {

        aperturaMobile();

      } else {

        aperturaDesktop();

      }

    }
  );


  /* =========================================================
     RITORNO DALL'APP DRIVE
     ========================================================= */

  document.addEventListener(
    "visibilitychange",
    function () {

      if (
        document.visibilityState === "hidden"
      ) {

        if (
          aperturaInCorso ||
          leggiMarker()
        ) {

          paginaDiventataNascosta = true;

        }


        return;

      }


      if (
        document.visibilityState === "visible" &&
        paginaDiventataNascosta &&
        leggiMarker()
      ) {

        tornaAllaHome();

      }

    }
  );


  /* =========================================================
     SAFARI / BFCACHE
     ========================================================= */

  window.addEventListener(
    "pageshow",
    function (evento) {

      /*
       * Se l'utente torna indietro da Drive web
       * e Safari ripristina la pagina dalla cache,
       * lo riportiamo alla HOME.
       */

      if (
        evento.persisted &&
        leggiMarker()
      ) {

        tornaAllaHome();

      }

    }
  );


  /* =========================================================
     FALLBACK FOCUS
     ========================================================= */

  window.addEventListener(
    "focus",
    function () {

      if (
        paginaDiventataNascosta &&
        leggiMarker()
      ) {

        tornaAllaHome();

      }

    }
  );


  /* =========================================================
     RIPRISTINO DOPO BACK / RELOAD
     ========================================================= */

  const markerEsistente =
    leggiMarker();


  if (markerEsistente) {

    const etaMarker =
      Date.now() - markerEsistente;


    /*
     * Se la pagina viene ricostruita dopo essere tornati
     * da Drive, il marker sopravvive nella sessione.
     *
     * Aspettiamo almeno 1 secondo per non intercettare
     * il click iniziale.
     */

    if (etaMarker > 1000) {

      window.setTimeout(
        function () {

          if (
            document.visibilityState === "visible" &&
            leggiMarker()
          ) {

            tornaAllaHome();

          }

        },
        180
      );

    }

  }


})();

</script>

</body>
</html>
